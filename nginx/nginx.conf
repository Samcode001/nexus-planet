events {}

http {
  upstream http_api {
    server http:3000;
  }

  upstream socket_api {
    server socket:8080;
  }

# server {
#     listen 80;
#     server_name api.nexusplanet.online socket.nexusplanet.online;
#     return 301 https://$host$request_uri;
# }

server {
    # listen 443 ssl;
    listen 80;
    server_name api.nexusplanet.online;

    # ssl_certificate /etc/letsencrypt/live/api.nexusplanet.online/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/api.nexusplanet.online/privkey.pem;

    location / {
        proxy_pass http://http_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    # listen 443 ssl;
    listen 80;
    server_name socket.nexusplanet.online;

    # ssl_certificate /etc/letsencrypt/live/api.nexusplanet.online/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/api.nexusplanet.online/privkey.pem;

    location / {
        proxy_pass http://socket_api;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

}